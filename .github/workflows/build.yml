name: Build CMD Window

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build_cmd.py"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_cmd.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "bo7med-x"
          git config user.email "bo7med-x@users.noreply.github.com"
          git add cmd.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "update cmd.svg"
          git push
